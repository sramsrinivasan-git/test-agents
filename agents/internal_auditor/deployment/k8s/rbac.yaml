# RBAC for the orchestrator pod to claim sandboxes at run time.
#
# Grants the `internal-auditor` ServiceAccount permission to
# create / get / watch / delete SandboxClaim resources in the same
# namespace as the warm pools. Also needs read access to the bound
# Sandbox object so the Python client can resolve podIPs.
#
# Namespaces here assume the warm pools live in `default` (matching
# sandbox-log-analyzer.yaml / sandbox-cloud-asset.yaml). If you move
# them, adjust the Role's namespace AND switch this to a ClusterRole +
# RoleBinding pair so the agent can claim across namespaces.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sandbox-claimer
  namespace: default
rules:
  - apiGroups: ["extensions.agents.x-k8s.io"]
    resources: ["sandboxclaims"]
    verbs: ["create", "get", "list", "watch", "delete"]
  # Read-only on the bound Sandbox so the Python client can resolve
  # status.podIPs[] after the claim becomes Ready.
  - apiGroups: ["agents.x-k8s.io"]
    resources: ["sandboxes"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: internal-auditor-can-claim-sandboxes
  namespace: default
subjects:
  - kind: ServiceAccount
    name: internal-auditor
    namespace: agents
roleRef:
  kind: Role
  name: sandbox-claimer
  apiGroup: rbac.authorization.k8s.io
