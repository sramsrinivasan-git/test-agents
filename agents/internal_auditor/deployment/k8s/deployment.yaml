apiVersion: apps/v1
kind: Deployment
metadata:
  name: internal-auditor
  namespace: default
  labels:
    app: internal-auditor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: internal-auditor
  template:
    metadata:
      labels:
        app: internal-auditor
    spec:
      serviceAccountName: internal-auditor
      containers:
        - name: internal-auditor
          # Replace with the image you pushed to Artifact Registry, e.g.
          # us-central1-docker.pkg.dev/PROJECT_ID/agents/internal-auditor:0.1.0
          image: REPLACE_WITH_ARTIFACT_REGISTRY_IMAGE
          imagePullPolicy: IfNotPresent
          # No ports / Service: this pod is a Pub/Sub subscriber, not an
          # HTTP server. Triggers arrive on PUBSUB_TRIGGER_SUBSCRIPTION;
          # results land in Cloud Logging keyed by run_id.
          env:
            # Model selection (ORCHESTRATOR_MODEL / SPECIALIST_MODEL)
            # lives in internal_auditor.config with sensible defaults.
            # Only override here if you intentionally want a non-default
            # model per environment (e.g. flash-lite in dev).
            #
            # Sandbox / MCP wiring. "cluster" mode means each specialist
            # tool call claims a fresh sandboxed MCP server pod from
            # the named warm pool, uses it, and releases it. See
            # rbac.yaml for the SandboxClaim permissions this needs.
            - name: SANDBOX_MODE
              value: "cluster"
            # The warm pools + SandboxClaim resources live in the
            # `agent-sandbox` namespace (the orchestrator pod itself runs
            # in `default`). rbac.yaml grants this pod's SA claim rights
            # in agent-sandbox via a cross-namespace RoleBinding.
            - name: SANDBOX_NAMESPACE
              value: "agent-sandbox"
            - name: GCP_LOG_ANALYZER_WARMPOOL
              value: "gcp-log-analyzer-warmpool-mcp"
            - name: GCP_CLOUD_ASSET_WARMPOOL
              value: "gcp-cloud-asset-warmpool-mcp"
            - name: MCP_SERVER_PORT
              value: "8080"
            - name: GOOGLE_CLOUD_PROJECT
              valueFrom:
                configMapKeyRef:
                  name: gcp-config
                  key: project_id
            # Vertex AI region used by ADK's Gemini client.
            - name: GOOGLE_CLOUD_LOCATION
              value: "us-central1"
            - name: GOOGLE_GENAI_USE_VERTEXAI
              value: "true"
            # Pub/Sub subscription this pod pulls audit triggers from.
            # Topic + subscription are created out-of-band (see the
            # k8s deployment README for the gcloud commands). The bound
            # GSA needs roles/pubsub.subscriber on this subscription.
            - name: PUBSUB_TRIGGER_SUBSCRIPTION
              value: "internal-auditor-triggers-sub"
            - name: PUBSUB_MAX_CONCURRENT
              value: "1"
          # Liveness via the heartbeat file written by common.heartbeat.tick().
          # Stale-after-90s; the subscriber backstops every 15s so a quiet
          # period (no messages) doesn't get the pod killed. Detects a
          # deadlocked subscriber, unlike a TCP/HTTP probe.
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - 'test -f /tmp/alive && test $(($(date +%s) - $(stat -c %Y /tmp/alive))) -lt 90'
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
