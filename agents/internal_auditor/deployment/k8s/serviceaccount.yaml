# Kubernetes ServiceAccount for the Internal Auditor pod.
#
# Bound to a Google Service Account via GKE Workload Identity so the
# agent can authenticate to Vertex AI (Gemini API) and any GCP services
# it talks to (BigQuery/Firestore once those land).
#
# Before applying: create the GSA and the IAM binding once (see
# deployment/k8s/README.md \xC2\xA72), then replace PROJECT_ID below with
# your project ID.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: internal-auditor
  namespace: default
  annotations:
    iam.gke.io/gcp-service-account: internal-auditor@PROJECT_ID.iam.gserviceaccount.com
