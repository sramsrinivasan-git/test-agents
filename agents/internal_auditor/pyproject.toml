[project]
name = "aaas-agent-internal-auditor"
version = "0.1.0"
description = "Internal Auditor: orchestrator + specialist agents on Google ADK + Gemini."
requires-python = ">=3.10"
dependencies = [
    "google-adk>=0.5",
    "google-genai>=0.7",
    "mcp>=1.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
]

[project.scripts]
internal-auditor-server = "internal_auditor.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# Standard src/ layout: the package directory `src/internal_auditor/`
# is exposed as the import name `internal_auditor`.
[tool.setuptools]
package-dir = { "" = "src" }
packages = ["internal_auditor"]
