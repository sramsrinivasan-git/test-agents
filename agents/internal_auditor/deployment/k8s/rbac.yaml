# RBAC for the orchestrator pod to claim sandboxes at run time.
#
# Topology:
#   - orchestrator pod + its KSA `internal-auditor`  -> namespace `default`
#   - warm pools + SandboxClaim + Sandbox resources  -> namespace `agent-sandbox`
#
# This is the cross-namespace case. A RoleBinding's roleRef must point at
# a Role in the SAME namespace as the RoleBinding, but its `subjects` may
# reference a ServiceAccount in ANOTHER namespace. So both the Role and
# the RoleBinding live in `agent-sandbox` (where the claims are created),
# and the subject is the orchestrator's SA over in `default`.
#
# Grants: create/get/list/watch/delete on SandboxClaim (the orchestrator
# creates a claim per tool call and deletes it on completion), plus
# read-only on the bound Sandbox so the Python client can resolve
# status.sandbox.podIPs[].
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sandbox-claimer
  namespace: agent-sandbox
rules:
  - apiGroups: ["extensions.agents.x-k8s.io"]
    resources: ["sandboxclaims"]
    verbs: ["create", "get", "list", "watch", "delete"]
  # Read-only on the bound Sandbox so the Python client can resolve
  # status.sandbox.podIPs[] after the claim becomes Ready.
  - apiGroups: ["agents.x-k8s.io"]
    resources: ["sandboxes"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: internal-auditor-can-claim-sandboxes
  namespace: agent-sandbox
subjects:
  - kind: ServiceAccount
    name: internal-auditor
    namespace: default
roleRef:
  kind: Role
  name: sandbox-claimer
  apiGroup: rbac.authorization.k8s.io
