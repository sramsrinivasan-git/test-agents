[project]
name = "aaas-mcp-server-gcp-log-analyzer"
version = "0.1.0"
description = "FastMCP server exposing Google Cloud Logging analysis tools."
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=2.0",
    "google-cloud-logging>=3.10.0",
]

[project.scripts]
gcp-log-analyzer-mcp = "gcp_log_analyzer.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# The folder `src/` IS the `gcp_log_analyzer` package — no inner directory
# named after the package. `package-dir` tells setuptools to expose the
# contents of `src/` under the import name `gcp_log_analyzer`.
[tool.setuptools]
package-dir = { "gcp_log_analyzer" = "src" }
packages = ["gcp_log_analyzer", "gcp_log_analyzer.tools"]
