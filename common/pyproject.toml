[project]
name = "aaas-common"
version = "0.1.0"
description = "Shared runtime for AaaS agents on GKE: sandbox claims, ADK runner, FastAPI serving."
requires-python = ">=3.10"
dependencies = [
    "google-adk>=0.5",
    "google-genai>=0.7",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "k8s-agent-sandbox[async]>=0.4.6,<0.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# Standard src/ layout: the package directory `src/common/` is exposed as
# the import name `common`.
[tool.setuptools]
package-dir = { "" = "src" }
packages = ["common"]
